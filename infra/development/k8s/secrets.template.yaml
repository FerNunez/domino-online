
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  username: "guest"
  password: "guest"
  uri: "amqp://guest:guest@rabbitmq:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  uri: "<POSTGRESQL_URI>"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis
type: Opaque
stringData:
  uri: "<REDIS_URI>"


