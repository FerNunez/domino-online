  <!-- finger crease lines -->
  <g transform="rotate(-12 88 145)">
    <g stroke="#f2f1ee" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 71 78 C 71 90, 71 100, 68 112"/>
      <path d="M 89 74 C 89 88, 89 98, 86 110"/>
      <path d="M 107 78 C 107 90, 107 100, 104 112"/>
